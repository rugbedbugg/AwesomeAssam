[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[project]
name = "assamese-asr"
version = "0.1.0"
description = "Research framework for measuring and improving Assamese ASR robustness (Milestone 0: IndicConformer baseline + WER/CER evaluation)"
readme = "README.md"
authors = [{ name = "Oxide 1-6", email = "yes.par781@gmail.com" }]
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
# Kept deliberately small. The IndicConformer runtime (PyTorch + AI4Bharat NeMo)
# is NOT a dependency of this package: it is installed separately, because the
# AI4Bharat NeMo fork is not published to PyPI. See README.md (Inference status).
dependencies = [
    "numpy>=1.26,<3",
    "soundfile>=0.12,<0.14",
    "soxr>=0.5,<0.6",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.14,<0.15",
]

[tool.uv.build-backend]
module-name = "assamese_asr"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: Ruff's default rule set changes between releases, which
# silently changes what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "UP"]