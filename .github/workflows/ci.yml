name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Trust project config
        run: mise trust

      - name: Locate uv cache
        id: cache
        run: echo "dir=$(mise exec -- uv cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: uv-${{ runner.os }}-${{ hashFiles('.python-version', 'uv.lock') }}

      # Tests are offline by design: no model download and no inference runtime
      # is required (the IndicConformer adapter is exercised through a fake
      # backend, and the missing-dependency path is asserted directly).
      - name: Install
        run: mise run install

      - name: Lint and test
        run: mise run check